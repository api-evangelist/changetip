name: ChangeTip
description: >-
  ChangeTip was a Bitcoin micropayments and social-tipping service built by ChangeCoin,
  Inc. (San Francisco), founded in 2013. It let people send small bitcoin tips across
  Twitter, Reddit, YouTube, Twitch, Facebook, Slack, email, and text by replying with
  an amount, settling the micropayment behind the scenes to a hosted wallet. ChangeTip
  published an open API and first-party client libraries (Python and JavaScript) so
  the community could build tipping integrations and pair external wallets. The company
  raised roughly $3.5M and was backed by 500 Startups, Pantera Capital, and Gil Penchina.
  ChangeCoin was acquired by Airbnb in 2016 and the tipping service was discontinued in
  November 2016; the site now serves only a shutdown notice with balance withdrawal. This
  profile is retained as a historical/defunct provider record in the API Evangelist network.
